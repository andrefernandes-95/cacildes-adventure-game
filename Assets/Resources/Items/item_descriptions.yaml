IronArmor:
  EN_Description: |
    Without a squire, putting on this colossus is a battle of its own. Your legs will tire quickly, and any hope of agility will vanish.
    But when your strength fails, this walking fortress will hold strong. Legend says it once saved Sir Galaz from tumbling off a cliff—too heavy to fall, too stubborn to die.
  PT_Description: |
    Sem um escudeiro, vestir este colosso é uma batalha à parte. O cansaço nas pernas vem rápido, a agilidade vai embora…
    Mas quando a força te faltar, esta muralha te protegerá. Dizem que salvou Sir Galaz de cair de um penhasco — de tão imóvel que o deixou.
  Items:
    - Iron Armor
    - Iron Helmet
    - Iron Gauntlets
    - Iron Legwear


